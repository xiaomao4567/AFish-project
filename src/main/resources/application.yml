server:
  port: 8080

spring:
  application:
    name: AFish-project
  datasource:
    url: jdbc:mysql://localhost:3306/afish?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.yitiaoyu.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    key-property: id
jwt:
  secret: yitiaoyu-jwt-secret-key-2024-secure-enough-32bytes
  expire: 86400000