server:
  port: 8080

spring:
  application:
    name: AFish-project
  profiles:
    active: dev
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.yitiaoyu.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    key-property: id